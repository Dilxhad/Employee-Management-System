<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5 text-center" style="max-width: 540px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-danger mb-3" th:text="${errorTitle}">Error</h3>
        <p class="text-muted mb-4" th:text="${errorMessage}">An error occurred.</p>
        <a th:href="@{/employees}" class="btn btn-primary">Back to Directory</a>
    </div>
</div>
</body>
</html>
