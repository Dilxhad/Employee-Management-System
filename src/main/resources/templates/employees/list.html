<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Employee Directory</h2>
        <a th:href="@{/employees/new}" class="btn btn-primary">+ Add Employee</a>
    </div>

    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${successMessage}"></span>
    </div>

    <form th:action="@{/employees}" method="get" class="row g-2 mb-4">
        <div class="col-md-5">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Search by name or department...">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-outline-secondary">Search</button>
            <a th:href="@{/employees}" class="btn btn-outline-dark">Reset</a>
        </div>
    </form>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Salary</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(employees)}">
                    <td colspan="6" class="text-center py-4 text-muted">No employees found.</td>
                </tr>
                <tr th:each="emp : ${employees}">
                    <td th:text="${emp.id}">1</td>
                    <td th:text="${emp.firstName + ' ' + emp.lastName}">Jane Doe</td>
                    <td th:text="${emp.email}">jane@company.com</td>
                    <td><span class="badge bg-secondary" th:text="${emp.department}">Engineering</span></td>
                    <td th:text="${#numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')}">75,000.00</td>
                    <td class="text-end">
                        <a th:href="@{/employees/{id}/edit(id=${emp.id})}" class="btn btn-sm btn-outline-primary">Edit</a>
                        <form th:action="@{/employees/{id}/delete(id=${emp.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Delete this employee?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
