<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${employee.id == null} ? 'Add Employee' : 'Edit Employee'">Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 640px;">
    <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
            <h4 class="mb-0" th:text="${employee.id == null} ? 'Add New Employee' : 'Edit Employee'"></h4>
        </div>
        <div class="card-body">
            <form th:action="${employee.id == null} ? @{/employees} : @{/employees/{id}(id=${employee.id})}"
                  th:object="${employee}" method="post" novalidate>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label">First Name</label>
                        <input type="text" th:field="*{firstName}" class="form-control"
                               th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                    </div>
                    <div class="col">
                        <label class="form-label">Last Name</label>
                        <input type="text" th:field="*{lastName}" class="form-control"
                               th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{lastName}"></div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control"
                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <input type="text" th:field="*{department}" class="form-control"
                           th:classappend="${#fields.hasErrors('department')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{department}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label">Salary</label>
                    <input type="number" step="0.01" th:field="*{salary}" class="form-control"
                           th:classappend="${#fields.hasErrors('salary')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{salary}"></div>
                </div>

                <div class="d-flex justify-content-end gap-2">
                    <a th:href="@{/employees}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary"
                            th:text="${employee.id == null} ? 'Create' : 'Update'"></button>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
